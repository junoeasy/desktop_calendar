name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    name: Publish Windows
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create app config from secrets
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          fs.mkdirSync("config", { recursive: true });
          fs.writeFileSync(
            "config/app.public.json",
            JSON.stringify(
              {
                googleClientId: process.env.GOOGLE_CLIENT_ID,
                googleClientSecret: process.env.GOOGLE_CLIENT_SECRET,
                googleRedirectPort: 42813
              },
              null,
              2
            )
          );
          console.log("app.public.json created");
          NODE

      - name: Align package version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version
          echo "Version aligned to $version"

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:publish:win

  publish-macos:
    name: Publish macOS
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect macOS signing secrets
        shell: bash
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set; macOS artifacts will be unsigned and not notarized."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "MACOS_SIGNING_MODE=signed" >> "$GITHUB_ENV"
          else
            echo "MACOS_SIGNING_MODE=unsigned" >> "$GITHUB_ENV"
          fi

      - name: Create app config from secrets
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          fs.mkdirSync("config", { recursive: true });
          fs.writeFileSync(
            "config/app.public.json",
            JSON.stringify(
              {
                googleClientId: process.env.GOOGLE_CLIENT_ID,
                googleClientSecret: process.env.GOOGLE_CLIENT_SECRET,
                googleRedirectPort: 42813
              },
              null,
              2
            )
          );
          console.log("app.public.json created");
          NODE

      - name: Align package version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version
          echo "Version aligned to $version"

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          npm run build

          if [ "$MACOS_SIGNING_MODE" = "signed" ]; then
            npx electron-builder --mac dmg zip --arm64 --publish never
            npx electron-builder --mac dmg zip --x64 --publish never
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dmg zip --arm64 --publish never -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dmg zip --x64 --publish never -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false
          fi

          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "DesktopCal Sync ${version}" --notes "DesktopCal Sync ${version}"

          cp "release/DesktopCal Sync-${version}-arm64.dmg" "release/DesktopCal-Sync-${version}-arm64.dmg"
          cp "release/DesktopCal Sync-${version}-arm64.dmg.blockmap" "release/DesktopCal-Sync-${version}-arm64.dmg.blockmap"
          cp "release/DesktopCal Sync-${version}-arm64-mac.zip" "release/DesktopCal-Sync-${version}-arm64-mac.zip"
          cp "release/DesktopCal Sync-${version}-arm64-mac.zip.blockmap" "release/DesktopCal-Sync-${version}-arm64-mac.zip.blockmap"
          cp "release/DesktopCal Sync-${version}.dmg" "release/DesktopCal-Sync-${version}.dmg"
          cp "release/DesktopCal Sync-${version}.dmg.blockmap" "release/DesktopCal-Sync-${version}.dmg.blockmap"
          cp "release/DesktopCal Sync-${version}-mac.zip" "release/DesktopCal-Sync-${version}-mac.zip"
          cp "release/DesktopCal Sync-${version}-mac.zip.blockmap" "release/DesktopCal-Sync-${version}-mac.zip.blockmap"
          node - <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");

          const version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          const files = [
            `DesktopCal-Sync-${version}-arm64-mac.zip`,
            `DesktopCal-Sync-${version}-mac.zip`
          ];
          const entries = files.map((name) => {
            const path = `release/${name}`;
            return {
              name,
              size: fs.statSync(path).size,
              sha512: crypto.createHash("sha512").update(fs.readFileSync(path)).digest("base64")
            };
          });
          const lines = [
            `version: ${version}`,
            "files:",
            ...entries.flatMap((entry) => [
              `  - url: ${entry.name}`,
              `    sha512: ${entry.sha512}`,
              `    size: ${entry.size}`
            ]),
            `path: ${entries[0].name}`,
            `sha512: ${entries[0].sha512}`,
            `releaseDate: '${new Date().toISOString()}'`,
            ""
          ];
          fs.writeFileSync("release/latest-mac.yml", lines.join("\n"));
          NODE

          gh release upload "$GITHUB_REF_NAME" \
            "release/DesktopCal-Sync-${version}-arm64.dmg" \
            "release/DesktopCal-Sync-${version}-arm64.dmg.blockmap" \
            "release/DesktopCal-Sync-${version}-arm64-mac.zip" \
            "release/DesktopCal-Sync-${version}-arm64-mac.zip.blockmap" \
            "release/DesktopCal-Sync-${version}.dmg" \
            "release/DesktopCal-Sync-${version}.dmg.blockmap" \
            "release/DesktopCal-Sync-${version}-mac.zip" \
            "release/DesktopCal-Sync-${version}-mac.zip.blockmap" \
            "release/latest-mac.yml" \
            --clobber
